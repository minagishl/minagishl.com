name: Mutual link request
description: Request to add your site to the Links section
labels: [links]
body:
  - type: input
    id: name
    attributes:
      label: Site name
    validations:
      required: true

  - type: input
    id: url
    attributes:
      label: URL
      placeholder: https://
    validations:
      required: true

  - type: input
    id: description
    attributes:
      label: Description
      description: One sentence about the site or its author.

  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: My site links back to this site
          required: true
        - label: The URL is publicly accessible
          required: true
